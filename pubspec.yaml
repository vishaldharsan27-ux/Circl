name: circl
description: "Circl - a real proximity-based social discovery app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  provider: ^6.1.2
  http: ^1.2.1
  socket_io_client: ^2.0.3+1
  geolocator: ^12.0.0
  shared_preferences: ^2.2.3
  jwt_decoder: ^2.0.1
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
